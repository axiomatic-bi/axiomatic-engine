name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    env:
      UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync project dependencies
        run: uv sync --group dev --group test --frozen

      - name: Run package quality gate
        run: uv run --group dev --group test python scripts/quality_gate.py

      - name: Build package distributions
        run: uv build --no-sources

      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error

      - name: Validate publish token
        run: |
          if [ -z "$UV_PUBLISH_TOKEN" ]; then
            echo "PYPI_API_TOKEN is not configured."
            exit 1
          fi

      - name: Publish to PyPI
        run: uv publish --trusted-publishing never
